name: 功能建议
description: 描述使用场景及希望改善的结果
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到什么问题
      description: 说明输入素材、使用场景，以及现有流程哪里无法满足需求。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 希望得到什么结果
      description: 尽量用一个具体例子描述输入和预期输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方法或补充信息
